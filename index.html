<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Karra Hrishikesh Reddy — Backend & Distributed Systems Engineer</title>
<meta name="description" content="Software Development Engineer specializing in high-throughput backend systems, personalization platforms and applied AI. SDE-2 at Super.Money (Flipkart Group)." />
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="nav" id="nav">
  <div class="nav-inner">
    <a href="#top" class="brand">
      <img class="avatar" id="brand-avatar" src="" alt="" />
      <span class="brand-text">
        <span class="brand-name" id="brand-name"></span>
        <span class="brand-role" id="brand-role"></span>
      </span>
    </a>
    <nav class="nav-links" id="nav-links"></nav>
    <div class="nav-actions">
      <a id="nav-resume" target="_blank" rel="noopener" class="btn btn-outline nav-resume">RESUME</a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<main id="top">

  <!-- HERO -->
  <section class="hero">
    <div class="hero-glow"></div>
    <div class="container">
      <p class="eyebrow reveal" id="hero-eyebrow"></p>
      <h1 class="hero-title reveal" id="hero-title"></h1>
      <p class="hero-sub reveal" id="hero-sub"></p>
      <div class="hero-cta reveal" id="hero-cta"></div>
      <p class="scroll-hint reveal" id="hero-scroll-hint"></p>
    </div>

    <div class="marquee">
      <div class="marquee-track" id="marquee-track"></div>
    </div>
  </section>

  <!-- MANIFESTO / APPROACH -->
  <section class="section" id="manifesto">
    <div class="container">
      <p class="section-label reveal" id="about-label"></p>

      <div class="manifesto-grid">
        <div class="about-bio reveal" id="about-bio"></div>
        <div class="about-details reveal" id="about-details"></div>
        <img class="about-photo reveal" id="about-photo" src="" alt="" />
      </div>
    </div>
  </section>

  <!-- TOOLKIT -->
  <section class="section section-alt" id="toolkit">
    <div class="container">
      <p class="section-label reveal" id="toolkit-label"></p>
      <div class="section-head">
        <h2 class="reveal" id="toolkit-heading"></h2>
        <p class="section-desc reveal" id="toolkit-desc"></p>
      </div>

      <div class="toolkit-grid reveal" id="toolkit-grid"></div>
    </div>
  </section>

  <!-- SELECTED WORK -->
  <section class="section" id="work">
    <div class="container">
      <p class="section-label reveal" id="work-label"></p>
      <div class="section-head">
        <h2 class="reveal" id="work-heading"></h2>
      </div>

      <div class="projects" id="projects"></div>
    </div>
  </section>

  <!-- TRAJECTORY -->
  <section class="section section-alt" id="trajectory">
    <div class="container">
      <p class="section-label reveal" id="trajectory-label"></p>
      <div class="section-head">
        <h2 class="reveal" id="trajectory-heading"></h2>
      </div>

      <div class="timeline" id="timeline"></div>
    </div>
  </section>

  <!-- ACHIEVEMENTS -->
  <section class="section" id="achievements">
    <div class="container">
      <p class="section-label reveal" id="achievements-label"></p>
      <div class="section-head">
        <h2 class="reveal" id="achievements-heading"></h2>
      </div>

      <div class="writing-list" id="writing-list"></div>
    </div>
  </section>

  <!-- CONTACT -->
  <section class="section contact" id="contact">
    <div class="container">
      <p class="section-label reveal" id="contact-label"></p>
      <h2 class="contact-title reveal" id="contact-title"></h2>
      <p class="section-desc reveal" id="contact-desc"></p>

      <div class="contact-grid">
        <div class="contact-links reveal" id="contact-links"></div>

        <form class="contact-form reveal" id="contact-form" method="POST">
          <input type="hidden" name="_subject" value="New message from portfolio site" />
          <input type="hidden" name="_template" value="table" />
          <input type="hidden" name="_captcha" value="true" />
          <div class="form-row">
            <div class="form-field">
              <label for="name">NAME *</label>
              <input type="text" id="name" name="name" required placeholder="Your name" />
            </div>
            <div class="form-field">
              <label for="email">EMAIL *</label>
              <input type="email" id="email" name="email" required placeholder="you@company.com" />
            </div>
          </div>
          <div class="form-field">
            <label for="subject">SUBJECT</label>
            <input type="text" id="subject" name="subject" placeholder="Backend role / project" />
          </div>
          <div class="form-field">
            <label for="message">MESSAGE *</label>
            <textarea id="message" name="message" rows="4" required placeholder="Tell me a bit about it..."></textarea>
          </div>
          <button type="submit" class="btn btn-solid">SEND MESSAGE</button>
          <p class="form-note" id="form-note"></p>
        </form>
      </div>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="container footer-inner">
    <span>© <span id="year"></span> <span id="footer-name"></span>.</span>
    <span id="footer-tagline"></span>
  </div>
</footer>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
